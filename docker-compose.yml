services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      K_ANON_THRESHOLD: ${K_ANON_THRESHOLD}
      FL_SERVICE_TOKEN: ${FL_SERVICE_TOKEN}
      FLOWER_SERVER_ADDRESS: ${FLOWER_SERVER_ADDRESS}
      MODELS_DIR: /models
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro

  flower:
    build:
      context: ./server
      dockerfile: Dockerfile.flower
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      API_BASE_URL: http://api:8000
      FL_SERVICE_TOKEN: ${FL_SERVICE_TOKEN}
      FLOWER_SERVER_ADDRESS: 0.0.0.0:9092
      FL_NUM_ROUNDS: ${FL_NUM_ROUNDS}
      MODELS_DIR: /models
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - ./models:/models

  # Observability
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./server/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./server/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  pgdata:
    driver: local
  promdata:
    driver: local
  grafanadata:
    driver: local

