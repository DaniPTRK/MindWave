[project]
name = "mindwave-server"
version = "0.1.0"
description = "MindWave backend: FastAPI + JWT + PostgreSQL + Flower aggregator"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13.0,<1.14.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=3.2,<4.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "prometheus-fastapi-instrumentator>=7.0",
    "flwr==1.11.*",
    "tensorflow-cpu==2.15.*",
    "numpy>=1.26,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

